name: Frontend (Admin Panel) Tests

# Runs the Vitest + React Testing Library suite whenever the admin panel changes.
on:
  push:
    branches: [main]
    paths:
      - 'frontend-react/**'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
    paths:
      - 'frontend-react/**'
      - '.github/workflows/frontend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test