name: ZAP security scan (SEC-05)

# Runs the OWASP ZAP API scan in SAFE mode (-S: passive checks only, no active attacks)
# against the deployed CEYLORA API. Start it from the Actions tab: "Run workflow".
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap:
    runs-on: ubuntu-latest
    steps:
      - name: ZAP API scan (safe mode)
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: 'https://ceylora-production.up.railway.app/swagger/v1/swagger.json'
          format: openapi
          cmd_options: '-S'
          allow_issue_writing: false
          fail_action: false