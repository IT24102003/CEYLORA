name: Agentic AI Tests

# Runs the pytest suite for the 4-agent LangGraph workflow (Planner / Domain Analysis /
# Action / Validation) whenever the agentic-ai service changes. The tests never call a
# real LLM, backend or network — external calls are replaced with fakes via monkeypatch —
# so this job needs nothing beyond the Python dependencies themselves.
on:
  push:
    branches: [main]
    paths:
      - 'agentic-ai/**'
      - '.github/workflows/agentic-ai-tests.yml'
  pull_request:
    paths:
      - 'agentic-ai/**'
      - '.github/workflows/agentic-ai-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentic-ai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            agentic-ai/requirements.txt
            agentic-ai/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest