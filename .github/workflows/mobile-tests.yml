name: Mobile (Flutter) Tests

# Runs the flutter_test suite (unit, provider and widget tests) whenever the mobile
# app changes.
on:
  push:
    branches: [main]
    paths:
      - 'mobile-flutter/**'
      - '.github/workflows/mobile-tests.yml'
  pull_request:
    paths:
      - 'mobile-flutter/**'
      - '.github/workflows/mobile-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test